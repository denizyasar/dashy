<!doctype html>
<html class="has-navbar-fixed-top">

<head>
    <meta charset=utf-8>
    <title>History</title>
    <meta http-equiv=X-UA-Compatible content="IE=edge">
    <meta name=viewport content="width=device-width,initial-scale=1">
    <link type="text/css" rel="stylesheet" href="/bulma.css">
    <link type="text/css" rel="stylesheet" href="/fontawesome.css">
    <link type="text/css" rel="stylesheet" href="/main.css">
    <style>
        html {
            overflow: auto;
            white-space: nowrap;
        }
    </style>
</head>

<body>

<nav class="navbar is-dark is-fixed-top" role="navigation" aria-label="main navigation">
    <div class="navbar-brand">
        <a class="navbar-item" href="/{{.Dashboard.Ident}}">
            <img src="/logo.png" class="sharpen-image">
            <p style="padding-left:8px;" class="is-family-monospace has-text-white">{{.Dashboard.Title}}</p>
        </a>
    </div>
</nav>

<section class="section">
    <div class="container">
        <div class="table-container">
            <table class="table is-fullwidth">
                <thead>
                <tr>
                    <th>Timestamp (UTC)</th>
                    <th>{{.Title}} {{if .Subtitle }}({{.Subtitle}}){{end}}</th>
                </tr>
                </thead>
                <tbody>
                {{$out := .}}
                {{range $entry := .History}}
                <tr>
                    <td>{{$entry.FormattedTimestamp}}</td>
                    <td>{{$entry.Value}} {{$out.Unit}}</td>
                </tr>
                {{end}}
                </tbody>
            </table>
        </div>
    </div>
</section>

</body>
</html>
