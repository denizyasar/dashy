<!doctype html>
<html class="has-navbar-fixed-top">

<head>
    <meta charset=utf-8>
    <title>Dashboards</title>
    <meta http-equiv=X-UA-Compatible content="IE=edge">
    <meta name=viewport content="width=device-width,initial-scale=1">
    <link type="text/css" rel="stylesheet" href="/bulma.css">
    <link type="text/css" rel="stylesheet" href="/fontawesome.css">
    <link type="text/css" rel="stylesheet" href="/main.css">
    <style>
        html {
            overflow: auto;
            white-space: nowrap;
        }

    </style>
</head>

<body>

    <nav class="navbar is-dark is-fixed-top" role="navigation" aria-label="main navigation">
        <div class="navbar-brand">
            <a class="navbar-item" href="/">
                <img src="/logo.png" class="sharpen-image">
                <p style="padding-left:8px;" class="is-family-monospace has-text-white">Dashboard</p>
            </a>
        </div>
        <div class="navbar-end">
            <div class="navbar-item">
                <a class="button is-light" href="/logout">Logout</a>
            </div>
        </div>
    </nav>

    <section class="section" style="padding:14px;">
        <div class="container">
            {{range $link := .Links}}
            <a class="box" href="{{$link.Url}}">
                <h1 class="title">{{$link.Name}}
                    <span class="icon is-pulled-right is-medium">
                        <i class="fas fa-arrow-right"></i>
                    </span>
                </h1>
            </a>
            {{end}}

        </div>
    </section>
</body>
</html>
